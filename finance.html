<!DOCTYPE html>
<html>
<head>
    <title>Personal Finance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="utf-8">
</head>
<body>
    <div class="container">
        <h1>Add Income</h1>
        <form id="finance-input-form">
            <div class="mb-3">
                <label for="incomeSourceName" class="form-label">Income Source Name</label>
                <input type="text" id="incomeSource" name="incomeSourceName" class = "form-control"><br>

                <label for="incomeAmount" class="form-label">Income Amount</label>
                <input type="text" id="incomeAmount" name="incomeAmount" class="form-control"><br>

                <label for="incomeFrequency" class="form-label">Income Frequency</label>
                <select id="incomeFrequency" name="incomeFrequency" class="form-control">
                <option value="oneTime">One Time</option>
                <option value="bi-weekly">Bi-Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly</option>
                </select>

                <span id="incomeError" class="error"></span><br>
                <input id="incomeSubmitBtn" type="submit" value="Submit" class="btn-primary btn">
            </div>
        </form>
        <h1>Add Expense</h1>
        <form id="expense-input-form">
            <div class="mb-3">
                <label for="placeOfExpense" class="form-label">Place of Expense</label>
                <input type="text" id="placeOfExpense" name="placeOfExpense" class = "form-control"><br>

                <label for="expenseDate" class="form-label">Expense Date</label>
                <input type="date" id="expenseDate" name="expenseDate" class="form-control"><br>

                <label for="expenseAmount" class="form-label">Expense Amount</label>
                <input type="text" id="expenseAmount" name="expenseAmount" class="form-control"><br>

                <label for="expenseType" class="form-label">Expense Type </label>
                <select id="expenseType" name="expenseType" class="form-control">
                    <option value="business">Business</option>
                    <option value="pleasure">Pleasure</option>
                    <option value="necessities">Necesseties</option>
                    <option value="misc">Miscellaneous</option>
                </select><br>

                <label for="modeOfPayment" class="form-label">Mode of Payment</label>
                <select id="modeOfPayment" name="modeOfPayment" class="form-control">
                    <option value="cash">Cash</option>
                    <option value="credit">Credit</option>
                    <option value="debit">Debit</option>
                    <option value="check">Check</option>
                </select><br>

                <label for="rational" class="form-label">Rational</label>
                <input type="text" id="rational" name="rational" class="form-control" optional>
                
                <span id="expenseError" class="error"></span><br>
                <input id="expenseSubmitBtn" type="submit" value="Submit" class="btn btn-primary">
            </div>
        </form>

        <h1>Add Check Payment</h1>
        <form id="check-payment-form">
            <div class="mb-3">
                <label for="nameOfCheck" class="form-label">Name of Check</label>
                <input type="text" id="nameOfCheck" name="nameOfCheck" class="form-control" required><br>

                <label for="checkDate" class="form-label">Check Date</label>
                <input type="date" id="checkDate" name="checkDate" class="form-control" required><br>

                <label for="checkAmount" class="form-label">Check Amount</label>
                <input type="text" id="checkAmount" name="checkAmount" class="form-control" required><br>

                <label for="bank" class="form-label">Bank</label>
                <input type="text" id="bank" name="bank" class="form-control" required><br>

                <label for="accountNumber" class="form-label">Account Number</label>
                <input type="text" id="accountNumber" name="accountNumber" class="form-control" required>
                
                <span id="checkError" class="error"></span><br>
                <input id="addCheckPaymentBtn" type="submit" value="Submit" class="btn btn-primary">
            </div>
        </form>
    </div>
    <script src="finance.js"></script>
</body>
</html>
